name: CI

on:
  push:
  pull_request:

# 同一分支新推一次就取消上一次还在跑的(省 runner、结果更快)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 固定版本:ruff 0.16.0(2026-07-23)起默认规则集扩大(BLE/S/RUF/I/SIM… 一并启用),
      # 不 pin 的话既有代码会在某次 ruff 发版后突然报 129 条、CI 无故转红。
      # 升级此处版本 = 一次独立的告警清理任务,别顺手带过。
      - name: Install ruff
        run: pip install ruff==0.15.22

      # 编译全部模块(含 tests 不 import 的 routes / modal_app / _comfy_ws 等):
      # 只编译不执行,无需真实依赖(aiohttp/modal/...),按版本捕获语法错(如 3.9 的 PEP604 坑)。
      - name: Compile all modules
        run: python -m compileall -q .

      # 核心纯函数单测:自带 modal / nodes / folder_paths 桩,无需真实依赖。
      - name: Unit tests
        run: python tests/test_core.py

      # 真实 aiohttp 路由测试。需要 aiohttp（本就是插件依赖，见 requirements.txt）——
      # 纯源码字符串检查验证不了"跑起来会怎样"，两轮 review 的 P1 都从那个缺口漏过。
      - name: Install runtime deps for route tests
        run: pip install aiohttp
      - name: Route tests
        run: python tests/test_routes.py

      - name: Lint (ruff)
        run: ruff check .

      # ComfyUI Registry 发布时的安全检查会拒绝 exec(S102)和行内多语句(E702)。
      # 这里提前在 CI 卡住,避免回归后发布被拒(历史上踩过)。
      - name: Registry security rules (no exec / no inline semicolons)
        run: ruff check --select S102,E702 .

  lint-js:
    # 前端是半个代码库(web/modal_bridge.js),但 Python 那条管不到它 —— 单独跑一次语法检查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JS syntax
        run: node --check web/modal_bridge.js
