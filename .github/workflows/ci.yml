name: CI

on:
  push:
  pull_request:

# 同一分支新推一次就取消上一次还在跑的(省 runner、结果更快)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 固定版本:ruff 0.16.0(2026-07-23)起默认规则集扩大(BLE/S/RUF/I/SIM… 一并启用),
      # 不 pin 的话既有代码会在某次 ruff 发版后突然报 129 条、CI 无故转红。
      # 升级此处版本 = 一次独立的告警清理任务,别顺手带过。
      - name: Install ruff
        run: pip install ruff==0.15.22

      # 编译全部模块(含 tests 不 import 的 routes / modal_app / _comfy_ws 等):
      # 只编译不执行,无需真实依赖(aiohttp/modal/...),按版本捕获语法错(如 3.9 的 PEP604 坑)。
      - name: Compile all modules
        run: python -m compileall -q .

      # ⚠ 权威门禁是 pytest。2026-09-02 codex 抓到:此前 CI 只跑
      # `python tests/test_core.py`,而那个自跑入口当时在 2957 行文件的第 1685 行 ——
      # 执行到 sys.exit() 就停,后面 36 条测试**连定义都没跑到**,其中包括路径囚笼、
      # admin 守卫、Registry 合规、sage 与 basicsr 补丁的全部测试。**CI 一直是绿的**:
      # 漏跑和全过在报告里长得一模一样。现已把入口挪到文件末尾,并有
      # test_selfrun_entrypoint_is_last_so_no_test_is_skipped 盯着不让它挪回去。
      # ⚠ 这一步必须排在 `pip install pytest` **之前**:它验的就是"没装 pytest 时能不能跑",
      # 放在后面等于在装了 pytest 的环境里跑,`import pytest` 这类硬依赖照样看不出来
      # (2026-09-02 第一版就放在了后面)。
      - name: Unit tests (无 pytest 的自跑路径)
        run: python tests/test_core.py

      # ⚠ aiohttp 必须在 pytest 步**之前**装:pytest 会收集 tests/test_routes.py,而它顶层
      #   `from aiohttp import web` —— 装晚了就是 collection error,整步红(review 抓到,
      #   第一版就把它排在了后面;本地看不出来是因为容器里早就装了 aiohttp)。
      #   aiohttp 本就是插件依赖(requirements.txt),不是为测试额外引入的。
      - name: Install pytest + aiohttp
        run: pip install pytest aiohttp
      - name: Unit + route tests (pytest — 权威)
        run: python -m pytest tests/ -q

      # 真实 aiohttp 路由测试的无 pytest 跑法(README 备选),单独再跑一次保证它没坏
      - name: Route tests (自跑路径)
        run: python tests/test_routes.py

      - name: Lint (ruff)
        run: ruff check .

      # ComfyUI Registry 发布时的安全检查会拒绝 exec(S102)和行内多语句(E702)。
      # 这里提前在 CI 卡住,避免回归后发布被拒(历史上踩过)。
      - name: Registry security rules (no exec / no inline semicolons)
        run: ruff check --select S102,E702 .

      # ⚠ Registry 服务端扫描器是 Bandit,不是 ruff(2026-09-05 查实:comfy-cli 本地那句
      #   「✓ All validation checks passed」只跑 ruff S102/S307/E702,与 Flagged 无关)。
      #   实测同期包:MEDIUM=0 → Active,1 条 B310 → Flagged;我们 0.8.x 有 4 条 MEDIUM
      #   (B310 ×2 / B108 ×2)。-ll = MEDIUM 及以上即失败;-x 排除的正是 .comfyignore 不打包的。
      - name: Registry security rules (Bandit MEDIUM+, 与服务端扫描器同源)
        run: pip install bandit && bandit -r . -x ./tests,./.github,./.venv -ll -q

  lint-js:
    # 前端是半个代码库(web/modal_bridge.js),但 Python 那条管不到它 —— 单独跑一次语法检查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JS syntax
        run: node --check web/modal_bridge.js
